name: Build ClassicExplorer x64

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Show MSBuild version
        shell: cmd
        run: msbuild -version

      - name: Verify ATL
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere `
            -latest `
            -version "[17.0,18.0)" `
            -products * `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio 2022 not found."
          }

          Write-Host "Visual Studio 2022:"
          Write-Host $vsPath

          $atl = Get-ChildItem `
            -Path "$vsPath\VC\Tools\MSVC" `
            -Recurse `
            -Filter atlbase.h `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $atl) {
            throw "ATL header atlbase.h not found."
          }

          Write-Host "ATL found:"
          Write-Host $atl.FullName

      - name: Build ClassicExplorer Release x64
        shell: cmd
        run: >
          msbuild ClassicExplorer.sln
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:RestorePackages=false

      - name: Collect DLL
        shell: powershell
        run: |
          Write-Host "Searching for ClassicExplorer.dll..."

          $dlls = Get-ChildItem `
            -Path . `
            -Recurse `
            -Filter ClassicExplorer.dll |
            Where-Object {
              $_.FullName -notmatch '\\obj\\'
            }

          if (-not $dlls) {
            throw "ClassicExplorer.dll was not produced."
          }

          $dlls | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path artifact |
            Out-Null

          Copy-Item `
            $dlls[0].FullName `
            artifact\ClassicExplorer.dll `
            -Force

      - name: Upload ClassicExplorer DLL
        uses: actions/upload-artifact@v4
        with:
          name: ClassicExplorer-x64-Release
          path: artifact/ClassicExplorer.dll
          if-no-files-found: error
