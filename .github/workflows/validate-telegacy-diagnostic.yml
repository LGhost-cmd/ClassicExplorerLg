name: Validate Telegacy diagnostic patches

on:
  push:
    branches: [master]
    paths:
      - 'telegacy-diagnostic/**'
      - '.github/workflows/validate-telegacy-diagnostic.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone exact Telegacy 1.0.4 source
        shell: pwsh
        run: git clone --depth 1 --branch v1.0.4 https://github.com/N3xtery/Telegacy.git telegacy-src

      - name: Copy diagnostic build files
        shell: pwsh
        run: |
          Copy-Item "telegacy-diagnostic\CMakeLists.txt" "telegacy-src\CMakeLists.txt" -Force
          Copy-Item "telegacy-diagnostic\vcpkg.json" "telegacy-src\vcpkg.json" -Force

      - name: Vendor Nayuki C QR generator
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "telegacy-src\third_party\qrcodegen" | Out-Null
          $base = "https://raw.githubusercontent.com/nayuki/QR-Code-generator/master/c"
          Invoke-WebRequest "$base/qrcodegen.h" -OutFile "telegacy-src\third_party\qrcodegen\qrcodegen.h"
          Invoke-WebRequest "$base/qrcodegen.c" -OutFile "telegacy-src\third_party\qrcodegen\qrcodegen.c"

      - name: Compile-check Python patch scripts
        shell: pwsh
        run: |
          python -m py_compile "telegacy-diagnostic\patch_chat_media_autoload_v65.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_media_resilience_v71.py"
          python -m py_compile "telegacy-diagnostic\patch_dialog_rows_v72.py"
          python -m py_compile "telegacy-diagnostic\patch_media_inplace_upgrade_v73.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_scope_sync_v74.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_scope_sync_v74_runner.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_interaction_paging_v75.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_interaction_paging_v75_runner.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_runtime_recovery_v76.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_channel_media_layout_v77.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_photo_click_download_v78.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_global_peer_photo_hit_v79.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_media_ole_rebind_v80.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_photo_open_sticker_viewport_v81.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_animated_stickers_v82.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_animated_sticker_stability_v83.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_media_stickers_forward_links_v84.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_sticker_layout_stability_v85.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_viewport_media_stability_v86.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_media_identity_stability_v87.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_runtime_sticker_stability_v88.py"

      - name: Apply complete diagnostic patch chain
        shell: pwsh
        run: |
          $patches = @(
            "patch_telegacy.py",
            "patch_fast_diagnostics.py",
            "patch_chat_search_id_fix.py",
            "patch_search_media.py",
            "patch_server_search.py",
            "patch_search_context.py",
            "patch_ui_media_server.py",
            "patch_media_gallery_nav.py",
            "patch_media_page_jump.py",
            "patch_media_stability_jump.py",
            "patch_media_direct_photo_parser.py",
            "patch_media_tabs_av.py",
            "patch_media_audio_video_fix.py",
            "patch_media_playback_start_fix.py",
            "patch_media_links_gallery.py",
            "patch_profiles_navigation.py",
            "patch_chat_video_reactions.py",
            "patch_chat_media_layout.py",
            "patch_chat_media_layout_v64.py"
          )
          foreach ($patch in $patches) {
            Write-Host "=== Applying $patch ==="
            python (Join-Path "telegacy-diagnostic" $patch) "telegacy-src"
            if ($LASTEXITCODE -ne 0) { throw "$patch failed with exit code $LASTEXITCODE" }
          }

      - name: Verify final Telegacy patch markers
        shell: pwsh
        run: |
          $message = Get-Content "telegacy-src\src\message.cpp" -Raw
          $helpers = Get-Content "telegacy-src\src\helpers.cpp" -Raw
          $response = Get-Content "telegacy-src\src\response.cpp" -Raw
          $runtime = Get-Content "telegacy-src\src\telegacy.cpp" -Raw
          $procs = Get-Content "telegacy-src\src\procs.cpp" -Raw
          if ($message -notmatch "chat_media_resilience_v71") { throw "v7.1 message marker missing" }
          if ($message -notmatch "media_chat_ensure_line_start") { throw "v7.1 block-layout helper missing" }
          if ($message -notmatch "stripped preview is a fallback") { throw "v7.1 stripped fallback missing" }
          if ($response -notmatch "response_handler_unsafe") { throw "v7.1 response boundary missing" }
          if ($response -notmatch "response v71 recovered parser exception") { throw "v7.1 crash recovery log missing" }
          if ($runtime -notmatch "dialog_rows_v72") { throw "v7.2 dialog cleanup marker missing" }
          if ($runtime -notmatch "media_inplace_upgrade_v73") { throw "v7.3 media in-place marker missing" }
          if ($runtime -notmatch "media_chat_upgrade_photo_in_place") { throw "v7.3 OLE upgrade helper missing" }
          if ($runtime -notmatch "chat_scope_sync_v74") { throw "v7.4 scope/sync marker missing" }
          if ($runtime -notmatch "contacts.search") { throw "v7.4 global contacts.search path missing" }
          if (-not $runtime.Contains('\u041c\u043e\u0438 \u0447\u0430\u0442\u044b')) { throw "v7.4 My Chats tab missing" }
          if (-not $runtime.Contains('\u0412\u0441\u0435 \u0447\u0430\u0442\u044b')) { throw "v7.4 All Chats tab missing" }
          if ($runtime -notmatch "wParam == 3013") { throw "v7.4 periodic sync timer missing" }
          if ($response -notmatch "contacts.found - chat_scope_sync_v74") { throw "v7.4 contacts.found parser missing" }
          if ($response -notmatch "telegacy_request_difference_sync") { throw "v7.4 update recovery missing" }
          if ($runtime -notmatch "chat_interaction_paging_v75") { throw "v7.5 runtime marker missing" }
          if (($runtime -notmatch "chat v75 photo double click") -and ($runtime -notmatch "chat v78 photo click") -and ($runtime -notmatch "chat v79 photo click")) { throw "v7.5/v7.8/v7.9 photo click path missing" }
          if ($helpers -notmatch "history_skip_next") { throw "v7.5 history skip state missing" }
          if ($helpers -notmatch "history_add_offset") { throw "v7.5 getHistory skip offset missing" }
          if (($response -notmatch "history v75 renderer skipped") -and ($response -notmatch "history v76 skipped dirty render") -and ($response -notmatch "history v77 skipped empty/footer-only row")) { throw "v7.5/v7.6/v7.7 renderer skip missing" }
          if ($response -notmatch "malformed item is not end-of-history") { throw "v7.5 parser-gap recovery missing" }
          if ($procs -notmatch "chat_history_scroll_guard_v75") { throw "v7.5 scroll-top guard missing" }
          if ($procs -notmatch "chat_photo_retry_dblclick_proc_v75") { throw "v7.5 direct photo double-click missing" }
          if ($runtime -notmatch "width - 320") { throw "v7.5 message-search spacing missing" }
          if ($runtime -notmatch "width - 295") { throw "v7.5 search-status spacing missing" }
          if ($runtime -notmatch "width - 125") { throw "v7.5 Media-button spacing missing" }
          if ($runtime -notmatch "chat_runtime_recovery_v76") { throw "v7.6 runtime marker missing" }
          if (($runtime -notmatch "photo click preempting active transfer") -and ($runtime -notmatch "chat v78 photo action preempting background transfer")) { throw "v7.6/v7.8 force-photo retry missing" }
          if ($runtime -notmatch "peer switch cancelled stale full-photo transfer") { throw "v7.6 peer-switch media reset missing" }
          if ($response -notmatch "history_v76_rollback_front_render") { throw "v7.6 history rollback missing" }
          if ($response -notmatch "history v76 page raw=") { throw "v7.6 raw-page pagination missing" }
          if ($response -notmatch "global_chat_search_is_result_peer") { throw "v7.6 search-only channel guard missing" }
          if ($response -notmatch "media_chat_full_photo_handle_rpc_error") { throw "v7.6 media rpc recovery missing" }
          if ($runtime -notmatch "chat_channel_media_layout_v77") { throw "v7.7 runtime marker missing" }
          if (($runtime -notmatch "media v77 native replaced OLE") -and ($runtime -notmatch "chat v84 native replaced OLE")) { throw "v7.7/v8.4 native OLE replacement missing" }
          if (($helpers -notmatch "!global_chat_search_is_result_peer\(current_peer\)") -and ($helpers -notmatch "Automatic chat media uses the native Telegram thumb request below")) { throw "v7.7/v8.1 native photo route missing" }
          if ($response -notmatch "media_chat_replace_loaded_bitmap") { throw "v7.7 response media replacement hook missing" }
          if ($response -notmatch "history v77 skipped empty/footer-only row") { throw "v7.7 footer-only history cleanup missing" }
          if ($runtime -notmatch "chat_photo_click_download_v78") { throw "v7.8 runtime marker missing" }
          if ($runtime -notmatch "media_chat_full_photo_save_and_open") { throw "v7.8 persistent photo download missing" }
          if (($runtime -notmatch "chat v78 photo click") -and ($runtime -notmatch "chat v79 photo click")) { throw "v7.8/v7.9 click handler missing" }
          if ($response -notmatch "media_chat_full_photo_retry_migrated") { throw "v7.8 FILE_MIGRATE click recovery missing" }
          if ($procs -notmatch "chat_photo_click_download_proc_v78") { throw "v7.8 direct photo mouse interception missing" }
          if ($runtime -notmatch "chat_global_peer_photo_hit_v79") { throw "v7.9 runtime marker missing" }
          if ($runtime -notmatch "chat v79 global search peer_channels=") { throw "v7.9 global peer parser missing" }
          if (($runtime -notmatch "chat v79 OLE click mapped") -and ($runtime -notmatch "chat v80 photo OLE mapped")) { throw "v7.9/v8.0 OLE click mapping missing" }
          if ($response -notmatch "chat v79 invalid global peer released history pending") { throw "v7.9 invalid-peer recovery missing" }
          if ($runtime -notmatch "chat_media_ole_rebind_v80") { throw "v8.0 runtime marker missing" }
          if ($runtime -notmatch "media_chat_v80_is_bitmap_ole") { throw "v8.0 bitmap OLE classifier missing" }
          if ($runtime -notmatch "chat v80 OLE ordinal rebind") { throw "v8.0 ordinal rebind missing" }
          if ($runtime -notmatch "chat v80 photo OLE mapped") { throw "v8.0 photo mapping log missing" }
          if ($runtime -notmatch "chat_photo_open_sticker_viewport_v81") { throw "v8.1 runtime marker missing" }
          if ($runtime -notmatch "chat v81 double-click completion opening downloaded photo") { throw "v8.1 double-click completion hook missing" }
          if ($runtime -notmatch "EM_GETSCROLLPOS") { throw "v8.1 pixel viewport capture missing" }
          if ($runtime -notmatch "chat v81 full photo repaint skipped") { throw "v8.1 duplicate repaint guard missing" }
          if ($message -notmatch "chat_photo_open_sticker_viewport_v81") { throw "v8.1 sticker autoload marker missing" }
          if ($response -notmatch "chat v81 sticker thumb bytes=") { throw "v8.1 sticker decoder missing" }
          if ($runtime -notmatch "chat_animated_stickers_v82") { throw "v8.2 runtime marker missing" }
          if ($runtime -notmatch "rlottie::Animation::loadFromData") { throw "v8.2 TGS rlottie path missing" }
          if ($runtime -notmatch "chat v82 WebM inline play") { throw "v8.2 WebM inline path missing" }
          if ($runtime -notmatch "media_chat_sticker_timer_proc") { throw "v8.2 animation timer missing" }
          if ($message -notmatch "media_chat_animated_sticker_queue") { throw "v8.2 message sticker queue missing" }
          if ($response -notmatch "media_chat_animated_sticker_download_complete") { throw "v8.2 sticker completion hook missing" }
          if ($runtime -notmatch "chat_animated_sticker_stability_v83") { throw "v8.3 runtime marker missing" }
          if ($runtime -notmatch "chat v83 sticker cache ready path=") { throw "v8.3 safe sticker cache missing" }
          if ($runtime -notmatch "media_chat_sticker_timer_proc_unsafe") { throw "v8.3 sticker timer crash boundary missing" }
          if ($runtime -notmatch "chat_media_stickers_forward_links_v84") { throw "v8.4 runtime marker missing" }
          if ($runtime -notmatch "chat v84 ambiguous native replace skipped") { throw "v8.4 media dedupe guard missing" }
          if ($runtime -notmatch "media_chat_sticker_load_webp_v84") { throw "v8.4 static sticker renderer missing" }
          if ($runtime -notmatch "chat_v84_open_forward_origin") { throw "v8.4 forwarded-origin navigation missing" }
          if ($helpers -notmatch "chat v84 forward origin link") { throw "v8.4 forwarded-origin RichEdit link missing" }
          if ($runtime -notmatch "chat_sticker_layout_stability_v85") { throw "v8.5 runtime marker missing" }
          if ($runtime -notmatch "media_chat_sticker_ensure_anchor_ole_v85") { throw "v8.5 sticker layout anchor missing" }
          if ($runtime -notmatch "chat v85 sticker anchor OLE inserted") { throw "v8.5 sticker anchor diagnostic missing" }
          if ($runtime -notmatch "bool webm_claimed = false") { throw "v8.5 WebM serialization missing" }
          if ($runtime -notmatch "chat v85 recovered sticker window exception") { throw "v8.5 sticker window crash boundary missing" }
          if ($runtime -notmatch "chat_viewport_media_stability_v86") { throw "v8.6 runtime marker missing" }
          if ($runtime -notmatch "media_chat_full_photo_target_v86") { throw "v8.6 exact photo target missing" }
          if (($runtime -notmatch "chat v86 full photo OLE replaced") -and ($runtime -notmatch "chat v87 full photo replaced exact")) { throw "v8.6/v8.7 full photo replacement missing" }
          if ($runtime -notmatch "media_chat_sticker_commit_webp_v86") { throw "v8.6 static sticker OLE commit missing" }
          if ($runtime -notmatch "media_chat_sticker_scroll_quiet_until_v86") { throw "v8.6 sticker scroll quiet period missing" }
          if ($helpers -notmatch "history v86 restored anchor") { throw "v8.6 history viewport restore missing" }
          if ($procs -notmatch "media_chat_sticker_scroll_event_v86") { throw "v8.6 sticker scroll hook missing" }
          if ($runtime -notmatch "chat_media_identity_stability_v87") { throw "v8.7 runtime marker missing" }
          if ($runtime -notmatch "media_chat_full_photo_ole_identity_v87") { throw "v8.7 exact OLE identity state missing" }
          if ($runtime -notmatch "chat v87 photo OLE captured") { throw "v8.7 photo OLE capture missing" }
          if ($runtime -notmatch "chat v87 full photo replaced exact") { throw "v8.7 exact photo replacement missing" }
          if ($runtime -notmatch "chat v87 photo replacement refused") { throw "v8.7 anti-duplication guard missing" }
          if ($runtime -notmatch "chat v87 WebM paused without release") { throw "v8.7 persistent WebM lifetime path missing" }
          if ($runtime -notmatch "media_chat_sticker_after_scroll_v87") { throw "v8.7 post-scroll reposition missing" }
          if ($procs -notmatch "WM_APP \+ 0x37B") { throw "v8.7 post-scroll message hook missing" }
          if ($runtime -notmatch "chat_runtime_sticker_stability_v88") { throw "v8.8 runtime marker missing" }
          if ($runtime -notmatch "last_origin_v88") { throw "v8.8 cached sticker geometry missing" }
          if ($runtime -notmatch "chat v88 WebM resumed inferred=") { throw "v8.8 inferred-geometry resume diagnostic missing" }
          if ($runtime -notmatch "media_chat_replace_loaded_bitmap_unsafe_v88") { throw "v8.8 async media crash boundary missing" }
          if ($runtime -notmatch "chat v88 recovered async media replace exception") { throw "v8.8 async media recovery log missing" }

      - name: Configure Win32 RelWithDebInfo
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw "VCPKG_INSTALLATION_ROOT is unavailable" }
          cmake -S telegacy-src -B telegacy-build -A Win32 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static

      - name: Build generated Telegacy
        shell: pwsh
        run: cmake --build telegacy-build --config RelWithDebInfo --parallel
