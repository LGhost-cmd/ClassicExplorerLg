name: Validate Telegacy diagnostic patches

on:
  push:
    branches: [master]
    paths:
      - 'telegacy-diagnostic/**'
      - '.github/workflows/validate-telegacy-diagnostic.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone exact Telegacy 1.0.4 source
        shell: pwsh
        run: git clone --depth 1 --branch v1.0.4 https://github.com/N3xtery/Telegacy.git telegacy-src

      - name: Copy diagnostic build files
        shell: pwsh
        run: |
          Copy-Item "telegacy-diagnostic\CMakeLists.txt" "telegacy-src\CMakeLists.txt" -Force
          Copy-Item "telegacy-diagnostic\vcpkg.json" "telegacy-src\vcpkg.json" -Force

      - name: Vendor Nayuki C QR generator
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "telegacy-src\third_party\qrcodegen" | Out-Null
          $base = "https://raw.githubusercontent.com/nayuki/QR-Code-generator/master/c"
          Invoke-WebRequest "$base/qrcodegen.h" -OutFile "telegacy-src\third_party\qrcodegen\qrcodegen.h"
          Invoke-WebRequest "$base/qrcodegen.c" -OutFile "telegacy-src\third_party\qrcodegen\qrcodegen.c"

      - name: Compile-check Python patch scripts
        shell: pwsh
        run: |
          python -m py_compile "telegacy-diagnostic\patch_chat_media_autoload_v65.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_media_resilience_v71.py"
          python -m py_compile "telegacy-diagnostic\patch_dialog_rows_v72.py"
          python -m py_compile "telegacy-diagnostic\patch_media_inplace_upgrade_v73.py"
          python -m py_compile "telegacy-diagnostic\patch_chat_scope_sync_v74.py"

      - name: Apply complete diagnostic patch chain
        shell: pwsh
        run: |
          $patches = @(
            "patch_telegacy.py",
            "patch_fast_diagnostics.py",
            "patch_chat_search_id_fix.py",
            "patch_search_media.py",
            "patch_server_search.py",
            "patch_search_context.py",
            "patch_ui_media_server.py",
            "patch_media_gallery_nav.py",
            "patch_media_page_jump.py",
            "patch_media_stability_jump.py",
            "patch_media_direct_photo_parser.py",
            "patch_media_tabs_av.py",
            "patch_media_audio_video_fix.py",
            "patch_media_playback_start_fix.py",
            "patch_media_links_gallery.py",
            "patch_profiles_navigation.py",
            "patch_chat_video_reactions.py",
            "patch_chat_media_layout.py",
            "patch_chat_media_layout_v64.py"
          )
          foreach ($patch in $patches) {
            Write-Host "=== Applying $patch ==="
            python (Join-Path "telegacy-diagnostic" $patch) "telegacy-src"
            if ($LASTEXITCODE -ne 0) { throw "$patch failed with exit code $LASTEXITCODE" }
          }

      - name: Verify final Telegacy patch markers
        shell: pwsh
        run: |
          $message = Get-Content "telegacy-src\src\message.cpp" -Raw
          $helpers = Get-Content "telegacy-src\src\helpers.cpp" -Raw
          $response = Get-Content "telegacy-src\src\response.cpp" -Raw
          $runtime = Get-Content "telegacy-src\src\telegacy.cpp" -Raw
          if ($message -notmatch "chat_media_resilience_v71") { throw "v7.1 message marker missing" }
          if ($message -notmatch "media_chat_ensure_line_start") { throw "v7.1 block-layout helper missing" }
          if ($message -notmatch "stripped preview is a fallback") { throw "v7.1 stripped fallback missing" }
          if ($response -notmatch "response_handler_unsafe") { throw "v7.1 response boundary missing" }
          if ($response -notmatch "response v71 recovered parser exception") { throw "v7.1 crash recovery log missing" }
          if ($runtime -notmatch "dialog_rows_v72") { throw "v7.2 dialog cleanup marker missing" }
          if ($runtime -notmatch "media_inplace_upgrade_v73") { throw "v7.3 media in-place marker missing" }
          if ($runtime -notmatch "media_chat_upgrade_photo_in_place") { throw "v7.3 OLE upgrade helper missing" }
          if ($runtime -notmatch "chat_scope_sync_v74") { throw "v7.4 scope/sync marker missing" }
          if ($runtime -notmatch "contacts.search") { throw "v7.4 global contacts.search path missing" }
          if ($runtime -notmatch "Мои чаты") { throw "v7.4 My Chats tab missing" }
          if ($runtime -notmatch "Все чаты") { throw "v7.4 All Chats tab missing" }
          if ($runtime -notmatch "wParam == 3013") { throw "v7.4 periodic sync timer missing" }
          if ($response -notmatch "contacts.found - chat_scope_sync_v74") { throw "v7.4 contacts.found parser missing" }
          if ($response -notmatch "telegacy_request_difference_sync") { throw "v7.4 update recovery missing" }

      - name: Configure Win32 RelWithDebInfo
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw "VCPKG_INSTALLATION_ROOT is unavailable" }
          cmake -S telegacy-src -B telegacy-build -A Win32 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static

      - name: Build generated Telegacy
        shell: pwsh
        run: cmake --build telegacy-build --config RelWithDebInfo --parallel
