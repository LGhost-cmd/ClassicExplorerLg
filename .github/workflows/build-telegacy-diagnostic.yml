name: Build Telegacy diagnostic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout build helper files
        uses: actions/checkout@v4

      - name: Clone exact Telegacy 1.0.4 source
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.0.4 https://github.com/N3xtery/Telegacy.git telegacy-src

      - name: Copy diagnostic build files
        shell: pwsh
        run: |
          Copy-Item "telegacy-diagnostic\CMakeLists.txt" "telegacy-src\CMakeLists.txt" -Force
          Copy-Item "telegacy-diagnostic\vcpkg.json" "telegacy-src\vcpkg.json" -Force

      - name: Vendor Nayuki C QR generator
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "telegacy-src\third_party\qrcodegen" | Out-Null
          $base = "https://raw.githubusercontent.com/nayuki/QR-Code-generator/master/c"
          Invoke-WebRequest "$base/qrcodegen.h" -OutFile "telegacy-src\third_party\qrcodegen\qrcodegen.h"
          Invoke-WebRequest "$base/qrcodegen.c" -OutFile "telegacy-src\third_party\qrcodegen\qrcodegen.c"

      - name: Apply diagnostic instrumentation
        shell: pwsh
        run: |
          python "telegacy-diagnostic\patch_telegacy.py" "telegacy-src"

      - name: Optimize diagnostic logging
        shell: pwsh
        run: |
          python "telegacy-diagnostic\patch_fast_diagnostics.py" "telegacy-src"
          
      - name: Fix chat search command ID
        shell: pwsh
        run: |
          python "telegacy-diagnostic\patch_chat_search_id_fix.py" "telegacy-src"

      - name: Add chat search and media archive
        shell: pwsh
        run: |
          python "telegacy-diagnostic\patch_search_media.py" "telegacy-src"

      - name: Upgrade message search to server search
        shell: pwsh
        run: |
          python "telegacy-diagnostic\patch_server_search.py" "telegacy-src"

      - name: Add Telegram-style search context
        shell: pwsh
        run: |
          python "telegacy-diagnostic\patch_search_context.py" "telegacy-src"

      - name: Polish search UI and add server Media
        shell: pwsh
        run: |
            python "telegacy-diagnostic\patch_ui_media_server.py" "telegacy-src"

      - name: Polish Media gallery and search fields
        shell: pwsh
        run: |
            python "telegacy-diagnostic\patch_media_gallery_nav.py" "telegacy-src"

      - name: Add direct Media page jump
        shell: pwsh
        run: |
          python "telegacy-diagnostic\patch_media_page_jump.py" "telegacy-src"

      - name: Stabilize Media and add go-to-message
        shell: pwsh
        run: |
          python "telegacy-diagnostic\patch_media_stability_jump.py" "telegacy-src"

      - name: Use direct safe Media photo parser
        shell: pwsh
        run: |
          python "telegacy-diagnostic\patch_media_direct_photo_parser.py" "telegacy-src"

      - name: Add Media tabs and classic A-V player
        shell: pwsh
        run: |
          python "telegacy-diagnostic\patch_media_tabs_av.py" "telegacy-src"

      - name: Show toolchain
        shell: pwsh
        run: |
          Write-Host "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          cmake --version
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "GitHub runner did not expose VCPKG_INSTALLATION_ROOT."
          }

      - name: Configure Win32 RelWithDebInfo
        shell: pwsh
        run: |
          cmake -S telegacy-src -B telegacy-build -A Win32 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static

      - name: Build
        shell: pwsh
        run: |
          cmake --build telegacy-build --config RelWithDebInfo --parallel

      - name: Extract official Telegacy runtime assets
        shell: pwsh
        run: |
          $setup = "Telegacy-1.0.4-Setup.exe"
          $runtime = "telegacy-runtime"

          Invoke-WebRequest `
            "https://github.com/N3xtery/Telegacy/releases/download/v1.0.4/Telegacy-1.0.4-Setup.exe" `
            -OutFile $setup

          New-Item -ItemType Directory -Force $runtime | Out-Null

          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          & $sevenZip x -y "-o$runtime" $setup

          Write-Host "Extracted runtime files:"
          Get-ChildItem $runtime -Recurse |
            Where-Object {
              $_.Name -eq "emoji_categories.dat" -or
              $_.Name -eq "emoji_shortcodes.ini" -or
              $_.Name -eq "emojis"
            } |
            Select-Object FullName

      - name: Collect diagnostic files
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null

          $exe = Get-ChildItem telegacy-build -Recurse -Filter "telegacy-diagnostic.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName artifact\ }

          $pdb = Get-ChildItem telegacy-build -Recurse -Filter "telegacy-diagnostic.pdb" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName artifact\ }

          if (Test-Path "telegacy-build\telegacy-diagnostic.map") {
            Copy-Item "telegacy-build\telegacy-diagnostic.map" artifact\
          }

          Copy-Item "telegacy-src\src\response.cpp" artifact\response-diag.cpp -Force
          Copy-Item "telegacy-src\src\helpers.cpp" artifact\helpers-diag.cpp -Force
          Copy-Item "telegacy-src\src\telegacy.cpp" artifact\telegacy-diag.cpp -Force
          Copy-Item "telegacy-src\src\conversions.cpp" artifact\conversions-diag.cpp -Force
          Copy-Item "telegacy-src\langs" "artifact\langs" -Recurse -Force
          $categories = Get-ChildItem "telegacy-runtime" -Recurse -Filter "emoji_categories.dat" |
            Select-Object -First 1

          $shortcodes = Get-ChildItem "telegacy-runtime" -Recurse -Filter "emoji_shortcodes.ini" |
            Select-Object -First 1

          $emojiDir = Get-ChildItem "telegacy-runtime" -Recurse -Directory -Filter "emojis" |
            Where-Object {
            (Get-ChildItem $_.FullName -Filter "*.ico" -ErrorAction SilentlyContinue).Count -gt 0
            } |
            Select-Object -First 1

          if (-not $categories) {
            throw "emoji_categories.dat was not found in official Telegacy setup"
          }

          if (-not $shortcodes) {
            throw "emoji_shortcodes.ini was not found in official Telegacy setup"
          }

          if (-not $emojiDir) {
            throw "emojis directory was not found in official Telegacy setup"
          }

          Copy-Item $categories.FullName "artifact\emoji_categories.dat" -Force
          Copy-Item $shortcodes.FullName "artifact\emoji_shortcodes.ini" -Force
          Copy-Item $emojiDir.FullName "artifact\emojis" -Recurse -Force
          Copy-Item "telegacy-src\src\message.cpp" artifact\message-diag.cpp -Force

          @"
          Telegacy diagnostic build
          =========================

          Run telegacy-diagnostic.exe normally.

          The runtime trace is written to:
              %TEMP%\Telegacy-diagnostic.log

          After the crash/diagnostic termination, send:
          1. %TEMP%\Telegacy-diagnostic.log
          2. the new Windows Event Viewer crash entry, if one exists
          3. if Windows created one, the new .mdmp file

          This build deliberately DOES NOT log message bodies, phone numbers,
          authentication tokens, passwords, or session.dat contents.
          "@ | Set-Content artifact\HOW_TO_TEST.txt -Encoding UTF8

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegacy-1.0.4-diagnostic-x86
          path: artifact
          if-no-files-found: error
